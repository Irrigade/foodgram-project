server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_set_header Host $http_host;  # ВАЖНО: передает хост с портом (192.168.207.60:8080)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    location /admin/ {
        proxy_set_header Host $http_host;  # ВАЖНО
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    # Статика Django (админка, DRF)
    location /static/admin/ {
        alias /backend_static/admin/;
    }
    location /static/rest_framework/ {
        alias /backend_static/rest_framework/;
    }

    # Медиа (картинки)
    location /media/ {
        alias /media/;
    }

    # Статика React (фронтенд)
    location /static/ {
        alias /frontend_static/static/;
    }

    # Главная страница (React)
    location / {
        root /frontend_static;
        try_files $uri $uri/ /index.html;
    }
}